services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_PASSWORD:-marqueza}
      MARIADB_DATABASE: marqueza
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-marqueza}
      MYSQL_DB: marqueza
      MYSQL_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
