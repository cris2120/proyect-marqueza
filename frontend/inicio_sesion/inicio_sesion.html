<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../shared/estilos-base.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css?v=20261110-login">
    <title>Iniciar sesión | MARQUEZA</title>
</head>

<body class="pagina-login">
<script src="../shared/persistencia-tema.js"></script>
    <!-- Contenedor de formulario -->
    <div class="contenedor">
        <!-- contenedor izquierda -->
        <div class="fondo left">
            <!-- fondo de formulario -->
            <img src="../fondo/Fondo 3.png" alt="fondo" class="fondo_img">
        </div>
        
        <!-- contenedor derecha formulario -->
        <form class="formulario right" id="formulario">
            
            <!-- titulo formulario -->
            <div class="cabecera_titulo">
                <img src="../fondo/icono 3.png" alt="Icono" class="Icono">
                <div class="contenedor_titulo">
                    <p class="titulo">MARQUEZA</p>
                    <p class="subtitulo">Confecciones que inspiran</p>
                </div>
            </div>
            
            <!-- subtitulo formulario -->
            <h2>Iniciar sesión</h2>
            <p class="texto">Accede a tu espacio de trabajo y continúa gestionando MARQUEZA.</p>
            
            <!-- contenedor de nombre de usuario -->
            <div class="campo-login">
                <label for="usuario">Nombre de usuario</label>
                <div class="input-shell"><i class="bx bx-user" aria-hidden="true"></i><input type="text" placeholder="Ingresa tu usuario o correo" class="caja_inicio" required autocomplete="username" id="usuario"></div>
            </div>
            
            <!-- contenedor de contraseña -->
            <div class="campo-login">
                <label for="contraseña">Contraseña</label>
                <div class="input-shell">
                    <i class="bx bx-lock-alt" aria-hidden="true"></i>
                    <input type="password" placeholder="Ingresa tu contraseña" class="caja_inicio" required autocomplete="current-password" id="contraseña">
                    <button type="button" class="password-toggle" id="toggle-contrasena" aria-label="Mostrar contraseña" aria-pressed="false">
                        <svg class="password-icon password-icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="password-icon password-icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                            <path d="m3 3 18 18"></path>
                            <path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.1 3.9"></path>
                            <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4-.8"></path>
                            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- recordar y olvidaste tu contraseña -->
            <div class="options">
                <label><input type="checkbox" class="check-recordarme"> Recordarme</label>
                <a href="../olvido_contrasena/recuperar.html">¿Olvidaste tu contraseña?</a>
            </div>
            
            <!-- boton de iniciar sesión -->
            <button type="submit" class="login-submit"><span>Iniciar sesión</span><i class="bx bx-right-arrow-alt" aria-hidden="true"></i></button>

            <p class="security-note"><i class="bx bx-shield-quarter"></i> Tus datos se utilizan únicamente para validar el acceso.</p>
            
            <!-- pie de contenedor -->
            <div class="footer">
                © 2026 Marqueza.C - Todos los derechos reservados
            </div>
        </form>

    </div>
<script src="../shared/auditoria.js?v=20261112-tab-session"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../shared/api.js?v=20261112-tab-session"></script>
<script src="inicio_sesion.js?v=20261112-tab-session"></script>
</body>

</html>
